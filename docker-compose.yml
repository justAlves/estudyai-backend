  x-estudeai: &estudeai
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@db:5432/estudeai
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?}
      CORS_ORIGIN: ${CORS_ORIGIN:?}
      APP_URL: ${APP_URL:?}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-true}
      OTEL_SERVICE_NAME: estudeai-api
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-openai/gpt-oss-20b}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-3.6-flash}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-EstudyAI <onboarding@resend.dev>}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}

  services:
    api:
      <<: *estudeai
      command: ["bun", "run", "src/index.ts"]
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      expose:
        - "3333"
      healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://localhost:3333/ >/dev/null || exit 1"]
        interval: 15s
        timeout: 5s
        retries: 5

    worker-plans:
      <<: *estudeai
      command: ["bun", "run", "worker:plans"]
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy

    worker-materials:
      <<: *estudeai
      command: ["bun", "run", "worker:materials"]
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy

    worker-simulations:
      <<: *estudeai
      command: ["bun", "run", "worker:simulations"]
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy

    worker-essays:
      <<: *estudeai
      command: ["bun", "run", "worker:essays"]
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy

    redis:
      image: redis:7-alpine
      restart: unless-stopped
      command: ["redis-server", "--appendonly", "yes"]
      volumes:
        - redis-data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 10

    db:
      image: pgvector/pgvector:pg16
      restart: unless-stopped
      environment:
        POSTGRES_DB: estudeai
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5432:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d estudeai"]
        interval: 5s
        timeout: 5s
        retries: 10

  volumes:
    redis-data:
    postgres-data:
